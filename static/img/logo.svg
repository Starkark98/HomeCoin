<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HomeCoin">
  <!-- HomeCoin logo (2.6.1): a house in front of a gold coin, in the colors of the app's palette -->
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f74ec"/>
      <stop offset="1" stop-color="#9a7bea"/>
    </linearGradient>
    <linearGradient id="hc-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeab5"/>
      <stop offset=".55" stop-color="#f6c75f"/>
      <stop offset="1" stop-color="#e7a535"/>
    </linearGradient>
    <linearGradient id="hc-house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5fe0"/>
      <stop offset="1" stop-color="#4b3fbf"/>
    </linearGradient>
  </defs>
  <!-- background tile with a soft light in the corner -->
  <rect width="64" height="64" rx="16" fill="url(#hc-bg)"/>
  <circle cx="52" cy="9" r="20" fill="#fff" fill-opacity=".07"/>
  <!-- gold coin, centered, with its inner ring -->
  <circle cx="32" cy="32" r="22" fill="url(#hc-coin)"/>
  <circle cx="32" cy="32" r="18.8" fill="none" stroke="#a36b05" stroke-opacity=".3" stroke-width="1"/>
  <!-- house: chimney, roof with eaves, body; the door is cut into the outline itself (open at the bottom, no edge
       left under it), so the coin shows through it -->
  <rect x="37.2" y="20.4" width="3.6" height="7" rx=".9" fill="url(#hc-house)"/>
  <path fill="url(#hc-house)"
        d="M16.4 31.6c-.9.8-.3 1.9.9 1.9h3.9v8.4a2 2 0 0 0 2 2H29.5V38.6a2.5 2.5 0 0 1 5 0V43.9h6.3a2 2 0 0 0 2-2v-8.4h3.9c1.2 0 1.8-1.1.9-1.9L33.2 19.2a1.9 1.9 0 0 0-2.4 0z"/>
</svg>
