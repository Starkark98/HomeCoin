<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HomeCoin">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hc-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="64" height="64" rx="16" fill="url(#hc-bg)"/>
  <!-- piggy-bank house -->
  <path d="M32 23.5 12.4 38.6c-1 .8-.5 2.4.8 2.4H17v8.6c0 2 1.6 3.6 3.6 3.6h22.8c2 0 3.6-1.6 3.6-3.6V41h3.8c1.3 0 1.8-1.6.8-2.4z" fill="#fff"/>
  <!-- slot on the roof -->
  <rect x="25.5" y="31.2" width="13" height="3.2" rx="1.6" fill="#7c3aed"/>
  <!-- arched door -->
  <path d="M28.2 53.2v-5.6a3.8 3.8 0 0 1 7.6 0v5.6z" fill="url(#hc-bg)"/>
  <!-- coin dropping into the slot -->
  <circle cx="32" cy="20" r="8.2" fill="url(#hc-coin)" stroke="#fff" stroke-width="1.8"/>
  <circle cx="32" cy="20" r="5.6" fill="none" stroke="#d97706" stroke-opacity=".55" stroke-width="1"/>
  <path d="M34.6 17.1a3.6 3.6 0 1 0 0 5.8M28.4 19h4.6M28.4 21h4.6" fill="none" stroke="#b45309" stroke-width="1.35" stroke-linecap="round"/>
</svg>
