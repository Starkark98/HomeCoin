<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HomeCoin">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hc-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".5" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="64" height="64" rx="15" fill="url(#hc-bg)"/>
  <!-- gold coin with its inner ring -->
  <circle cx="32" cy="32" r="21.5" fill="url(#hc-coin)"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#b45309" stroke-opacity=".35" stroke-width="1"/>
  <!-- house struck into the coin, optically centered (its visual weight sits on the coin's center) -->
  <path d="M32 17.7 44 27.8v12a1.9 1.9 0 0 1-1.9 1.9H21.9a1.9 1.9 0 0 1-1.9-1.9v-12z" fill="url(#hc-bg)"/>
  <!-- arched door -->
  <path d="M29.5 41.7v-4.6a2.5 2.5 0 0 1 5 0v4.6z" fill="#fde68a"/>
</svg>
